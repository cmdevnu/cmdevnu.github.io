<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Navigation Bar</title>
  <style>
    
    header {
      background: url(images/header.jpg);
      height: 100px;
      width: 900px;
      margin-left: 20%;
      margin-right: 25%;
    }

    #logo {
      padding: 20px 0 0 50px;
    }

    #menu_top {
      margin-top: 15px;
      margin-left: 30px;
      background: #ffffff;
      height: 40px;
      opacity: 0.65;
      border-radius: 10px 0px 0px 10px;
    }

    
    .level1 {
      list-style-type: none;   
      padding-top: 12px;
    }

    .level1 li {
      display: inline;         
      float: left;           
      padding: 0px 20px 0px 0px;
      height: 27px;
      font-weight: bold;
    }

    .level1 li a,
    .level1 li a:visited {
      color: red;            
      text-decoration: none;  
    }

    .level1 li a:hover {
      color: green;           
    }

    
    .level2 {
      display: none;          
      position: absolute;    
      padding: 6px;
      margin-top: 5px;
    }

    
    .level1 li:hover .level2 {
      display: block;
    }

    .level2 li {
      float: none;           
      position: relative;
      display: block;        
      padding: 5px;
      height: auto;
      background: #ccc;      
    }

    .level2 li:hover {
      background: #4cc;      
    }
  </style>
</head>
<body>

  <header>
    <div id="logo">
      
    </div>
    <div id="menu_top">
      <ul class="level1">
        <li><a href="#">Home</a></li>
        <li>
          <a href="#">Products</a>
          <ul class="level2">
            <li><a href="#">Product 1</a></li>
            <li><a href="#">Product 2</a></li>
            <li><a href="#">Product 3</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Services</a>
          <ul class="level2">
            <li><a href="#">Consulting</a></li>
            <li><a href="#">Support</a></li>
          </ul>
        </li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </header>

</body>
</html>
